imagePullSecret:
  name: harbor-regcred

mallAdmin:
  replicaCount: 2

  image:
    repository: 10.10.10.10/homemall/mall-admin
    tag: gate12-public-url
    pullPolicy: IfNotPresent

  service:
    port: 8080

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60

  pdb:
    enabled: true
    maxUnavailable: 1

adminWeb:
  replicaCount: 1

  image:
    repository: 10.10.10.10/homemall/admin-web
    tag: "17"
    pullPolicy: Always

  service:
    port: 80

mallPortal:
  replicaCount: 1

  image:
    repository: 10.10.10.10/homemall/mall-portal
    tag: gate12-secure-config
    pullPolicy: IfNotPresent

  service:
    port: 8085

mallAppWeb:
  replicaCount: 1

  image:
    repository: 10.10.10.10/homemall/mall-app-web
    tag: gate11
    pullPolicy: IfNotPresent

  service:
    port: 80

externalServices:
  mysql:
    host: mysql
    port: 3306
    database: mall
    username: homemall_app
    secretName: mysql-app-secret
    passwordKey: MYSQL_APP_PASSWORD

  redis:
    host: redis
    port: 6379
    database: 0
    secretName: redis-secret
    passwordKey: REDIS_PASSWORD

ingress:
  enabled: true
  className: traefik
  host: admin.chweca.com

mallAppIngress:
  enabled: true
  className: traefik
  host: mall.chweca.com

# Gate 12 - MinIO 对象存储
minio:
  endpoint: "http://10.10.10.36:9000"
  bucketName: "mall"
  publicUrl: "http://img.chweca.com"

{{- if .Values.mallAdmin.autoscaling.enabled }}

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: mall-admin
  namespace: {{ .Release.Namespace }}

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mall-admin

  minReplicas: {{ .Values.mallAdmin.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.mallAdmin.autoscaling.maxReplicas }}

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.mallAdmin.autoscaling.targetCPUUtilizationPercentage }}

{{- end }}

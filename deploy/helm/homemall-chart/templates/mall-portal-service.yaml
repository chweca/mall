apiVersion: v1
kind: Service

metadata:
  name: mall-portal
  namespace: {{ .Release.Namespace }}
  labels:
    app: mall-portal

spec:
  selector:
    app: mall-portal

  ports:
    - name: http
      port: {{ .Values.mallPortal.service.port }}
      targetPort: {{ .Values.mallPortal.service.port }}

apiVersion: discovery.k8s.io/v1
kind: EndpointSlice

metadata:
  name: minio-external
  namespace: {{ .Release.Namespace }}

  labels:
    kubernetes.io/service-name: minio-external
    endpointslice.kubernetes.io/managed-by: homemall-helm

addressType: IPv4

ports:
  - name: http
    protocol: TCP
    port: 9000

endpoints:
  - addresses:
      - "10.10.10.36"
    conditions:
      ready: true

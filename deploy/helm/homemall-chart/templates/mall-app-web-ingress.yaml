{{- if .Values.mallAppIngress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: mall-app-web

  namespace: {{ .Release.Namespace }}

spec:

  ingressClassName: {{ .Values.mallAppIngress.className }}

  rules:

    - host: {{ .Values.mallAppIngress.host }}

      http:

        paths:

          - path: /
            pathType: Prefix

            backend:

              service:
                name: mall-app-web

                port:
                  number: {{ .Values.mallAppWeb.service.port }}


{{- end }}
